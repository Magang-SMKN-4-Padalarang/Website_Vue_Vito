<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div id="app">
        <nav class="navbar navbar-expand-md navbar-dark bg-success">
            <div class="container-fluid"> <a class="navbar-brand" href="#">Vue home</a> <button
                    class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation"> <span
                        class="navbar-toggler-icon"></span> </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto mb-2 mb-md-0">
                        <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Home</a> </li>
                    </ul>
                    <button @click="handleLogout" class="btn btn-danger">Logout</button>
                </div>
            </div>
        </nav>
        <main class="container py-5">
            <div class="d-flex justify-content-center align-items-center mb-4">
                <div class="card shadow-sm border-0 m-100">
                    <div class="card-body p-4 p-md-5">
                        <div>
                            <h1 class="h-3 mb-3">Ini adalah Halaman Home</h1>
                            <p> Selamat Datang {{ email }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module">
        import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
        createApp({
            setup() {
                const email = ref('')

                onMounted(() => {
                    const savedEmail = localStorage.getItem('userEmail')
                    if (!savedEmail) {
                        window.location.href = 'index.html'
                    } else {
                        email.value = savedEmail
                    }
                })

                const handleLogout = () => {
                    localStorage.removeItem('userEmail')
                    window.location.href = 'index.html'
                }
                return { email, handleLogout }
            }

        }).mount('#app')
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
